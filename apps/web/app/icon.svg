<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06241a"/>
      <stop offset="50%" stop-color="#021811"/>
      <stop offset="100%" stop-color="#010c08"/>
    </linearGradient>
    <linearGradient id="clvlWingTop" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="clvlWingCenter" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="clvlWingBottom" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="60%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="clvlCorkGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="80%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#10b981" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="48" height="48" rx="12" fill="url(#bg)"/>
  <rect width="48" height="48" rx="12" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4"/>

  <path d="M9 39L39 9" stroke="rgba(52, 211, 153, 0.25)" stroke-width="1.2" stroke-dasharray="2 3"/>

  <g filter="url(#glow)">
    <!-- Wing 1: Top Feather -->
    <path d="M13 30C15 21 22 16 31 16C26 20 23 24 20 29Z" fill="url(#clvlWingTop)"/>
    <!-- Wing 2: Center Main Blade -->
    <path d="M10 33C13 22 23 17 34 19C27 24 21 28 16 34Z" fill="url(#clvlWingCenter)"/>
    <!-- Wing 3: Bottom Feather -->
    <path d="M13.5 35.5C18 30.5 25 27.5 32 28.5C26 32.5 21 34.5 17 36.5Z" fill="url(#clvlWingBottom)"/>
    <!-- Red Collar Tape -->
    <path d="M31.2 15.5L34.2 18.5L32.2 21L29.2 18Z" fill="#f43f5e"/>
    <!-- Gold Cork -->
    <ellipse cx="35.5" cy="17.5" rx="4.6" ry="4.6" fill="url(#clvlCorkGold)"/>
    <circle cx="36.8" cy="16.2" r="1.3" fill="#ffffff"/>
  </g>
</svg>
